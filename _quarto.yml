project:
  type: book
  output-dir: docs
  resources:
    - "slides/*.pdf"
    - "code/*.R"
    - "data/*.csv"

book:
  title: "Applied Economics"
  subtitle: "University of Vienna, Winter 2026/2027"
  author: "Pello Aspuru"
  repo-url: https://github.com/pelloaspuru/ae_pa
  search: true
  chapters:
    - index.qmd
    - intro.qmd
    - mlr1.qmd
    - mlr2.qmd
    - ols-variance.qmd
    - inference.qmd
    - causality.qmd
    - iv.qmd
    - panel.qmd
    - did.qmd
    - rdd.qmd
  page-footer:
    left: "Applied Economics, University of Vienna"
    right: "Built with [Quarto](https://quarto.org/)"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    code-overflow: wrap
    fig-width: 7
    fig-height: 4.5

execute:
  freeze: auto
  message: false
