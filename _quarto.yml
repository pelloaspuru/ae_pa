project:
  type: book
  output-dir: docs
  execute-dir: project
  resources:
    - "slides/*.pdf"
    - "code/*.R"
    - "data/*.csv"
    - "00_syllabus/project_instructions.pdf"
    - "00_syllabus/mock_exam.pdf"

book:
  title: "Applied Economics"
  subtitle: "University of Vienna, Winter 2026/2027"
  author: "Pello Aspuru"
  repo-url: https://github.com/pelloaspuru/ae_pa
  search: true
  chapters:
    - index.qmd
    - chapters/01_intro.qmd
    - chapters/02_datasets.qmd
    - chapters/03_data_construction.qmd
    - chapters/04_plotting.qmd
    - chapters/05_EconometricsReview.qmd
    - chapters/06_iv.qmd
    - chapters/07_panel.qmd
    - chapters/08_did.qmd
    - chapters/09_rdd.qmd
  page-footer:
    left: "Applied Economics, University of Vienna"
    right: "Built with [Quarto](https://quarto.org/)"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: left
    include-after-body: toc-in-sidebar.html
    code-overflow: wrap
    fig-width: 7
    fig-height: 4.5

execute:
  freeze: auto
  message: false
