project:
  type: book
  output-dir: docs
  resources:
    - "slides/*.pdf"
    - "code/*.R"
    - "data/*.csv"

book:
  title: "Applied Economics"
  subtitle: "University of Vienna, Winter 2026/2027"
  author: "Pello Aspuru"
  repo-url: https://github.com/pelloaspuru/ae_pa
  search: true
  chapters:
    - index.qmd
    - 01_intro.qmd
    - 02_plotting.qmd
    - 03_mlr1.qmd
    - 04_mlr2.qmd
    - 05_ols-variance.qmd
    - 06_inference.qmd
    - 07_causality.qmd
    - 08_iv.qmd
    - 09_panel.qmd
    - 10_did.qmd
    - 11_rdd.qmd
  page-footer:
    left: "Applied Economics, University of Vienna"
    right: "Built with [Quarto](https://quarto.org/)"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: left
    include-after-body: toc-in-sidebar.html
    code-overflow: wrap
    fig-width: 7
    fig-height: 4.5

execute:
  freeze: auto
  message: false
