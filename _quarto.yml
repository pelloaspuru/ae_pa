project:
  type: book
  output-dir: docs
  resources:
    - "slides/*.pdf"
    - "code/*.R"
    - "data/*.csv"

book:
  title: "Applied Economics"
  subtitle: "University of Vienna, Winter 2026/2027"
  author: "Pello Aspuru"
  repo-url: https://github.com/pelloaspuru/ae_pa
  search: true
  chapters:
    - index.qmd
    - 01_intro.qmd
    - 02_datasets.qmd
    - 03_data_construction.qmd
    - 04_plotting.qmd
    - 05_mlr1.qmd
    - 06_mlr2.qmd
    - 07_ols-variance.qmd
    - 08_inference.qmd
    - 09_causality.qmd
    - 10_iv.qmd
    - 11_panel.qmd
    - 12_did.qmd
    - 13_rdd.qmd
  page-footer:
    left: "Applied Economics, University of Vienna"
    right: "Built with [Quarto](https://quarto.org/)"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: left
    include-after-body: toc-in-sidebar.html
    code-overflow: wrap
    fig-width: 7
    fig-height: 4.5

execute:
  freeze: auto
  message: false
